<!doctype html><meta charset="utf-8"><title>Web save smoke</title>
<h1>IndexedDB save smoke</h1><pre id="result">Running…</pre>
<script>
window.LibraryManager = {library: {}};
window.mergeInto = Object.assign;
window.UTF8ToString = value => value;
const waiting = new Map();
window.SendMessage = (target, method, text) => {
  const message = JSON.parse(text), pair = waiting.get(message.id);
  waiting.delete(message.id);
  if (message.error) pair.reject(new Error(message.error)); else pair.resolve(message.value);
};
</script>
<script src="../Assets/Plugins/WebGL/WebStorySaveStore.jslib"></script>
<script>
let sequence = 0;
const key = '__codex_smoke__/storage-v1';
function call(op, value = '') {
  return new Promise((resolve, reject) => {
    const id = String(++sequence);
    waiting.set(id, {resolve, reject});
    LibraryManager.library.SomeGameWebSave('fixture', id, op, key, value);
  });
}
(async () => {
  if (location.hash !== '#read') {
    await call('write', '{"checkpoint":42}');
    location.replace(location.pathname + '#read');
    location.reload();
    return;
  }
  if (await call('read') !== '{"checkpoint":42}') throw new Error('Reload lost save');
  await call('delete');
  if (await call('read') !== null) throw new Error('Delete failed');
  document.getElementById('result').textContent =
    'PASS: transaction commit, page reload, exact state read, delete, missing key.';
})().catch(error => document.getElementById('result').textContent = 'FAIL: ' + error);
</script>
