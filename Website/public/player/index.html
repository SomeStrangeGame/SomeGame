<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Читать историю · Кострома</title>
  <link rel="stylesheet" href="/player/reader.css">
  <script src="/player/reader.js" defer></script>
</head>
<body>
  <header class="reader-header">
    <button id="return" type="button">← К историям</button>
    <div class="heading"><span>Кострома</span><h1 id="title">Читать историю</h1></div>
    <p id="status" role="status" aria-live="polite">Подключаем плеер…</p>
  </header>
  <main class="stage">
    <div class="viewport"><canvas id="canvas" tabindex="0" aria-label="Интерактивная история"></canvas></div>
    <section id="panel" class="panel" aria-labelledby="panel-title">
      <div class="panel-card">
        <h2 id="panel-title">Готовим историю</h2>
        <p id="message">Первая загрузка может занять немного времени.</p>
        <progress id="progress" aria-label="Загрузка плеера" max="1"></progress>
        <button id="retry" type="button" hidden>Повторить попытку</button>
        <button id="next" type="button" hidden>Следующий эпизод →</button>
        <noscript><p>Для чтения необходимо включить JavaScript.</p></noscript>
      </div>
    </section>
  </main>
</body>
</html>
